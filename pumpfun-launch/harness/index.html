<!DOCTYPE html>
<!-- Named-wallet/version SIGN-ONLY compatibility harness for the two-signer CREATE plan.
     Offline by construction: no fetch(), no submission of any kind. Rebuilds/parses from
     the textarea, hands it to the installed wallet's signTransaction, shows digests +
     signatures on-screen (copy back to create_sign_cli.py for full validator-stack run).
     MODES (?mode=):
       (default)  : textarea = unsigned PLAN PACKAGE json → frozen message → signTransaction
       partial    : textarea = PARTIALLY-SIGNED tx b64 (slot1 = valid mint sig, slot0 = default)
                    → derive frozen message + expected signer FROM THE TX ITSELF, validate both
                    against the pinned ?wallet= / &digest= values, then signTransaction
       signMessage: diagnostic only — NOT a tx-signing compatibility claim; not promoted to
                    customer onboarding
     TEST-ONLY, dedicated test transaction, no broadcasting anywhere.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREATE sign-only test harness (TEST-ONLY)</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;line-height:1.45}
  pre{background:#0b1021;color:#cfe3ff;padding:.8rem;border-radius:8px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere}
  h1{font-size:1.3rem}
  .tag{display:inline-block;background:#b00;color:#fff;padding:.25rem .6rem;border-radius:6px;font-weight:700;font-size:.8rem}
  .warn{background:#fff3cd;border:1px solid #eed202;padding:.6rem .8rem;border-radius:8px}
  button{padding:.6rem 1rem;border-radius:8px;border:1px solid #2a6;font-weight:600;cursor:pointer;margin:.2rem .3rem .2rem 0}
  #result:empty::before{content:"(no wallet response yet)";color:#888}
  .err{color:#fff;background:#c62828;padding:.6rem .8rem;border-radius:8px;margin:.6rem 0;font-weight:600}
  .err:empty{display:none}
</style>
</head>
<body>
<h1>CREATE sign-only test harness</h1>
<p><span class="tag">TEST-ONLY</span> <span class="tag">SIGN-ONLY — NO BROADCAST</span></p>
<div id="modeBanner" class="warn" style="margin:.6rem 0"></div>
<p class="warn">This page never sends anything anywhere.</p>

<h2 id="inputHeading">1. Input</h2>
<p id="inputHint" class="fine"></p>
<textarea id="pkg" rows="10" style="width:100%"></textarea>

<h2>2. Sign (your wallet decides; page never broadcasts)</h2>
<button id="sign">Sign with installed wallet</button>
<button id="clearErr" style="display:none">Dismiss error</button>
<div id="err" class="err"></div>
<span id="walletName"></span>

<h2>3. Result</h2>
<pre id="result"></pre>

<script src="https://unpkg.com/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);

function getProvider() {
  return window.solana || window.backpack || window.glow || null;
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToB64(bytes) {
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}
async function sha256Hex(bytes) {
  const d = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// URL-pinned expectations (enforced in BOTH modes)
const QS = new URLSearchParams(location.search);
const EXPECT_WALLET = QS.get("wallet");
const EXPECT_DIGEST = QS.get("digest");
const MODE = QS.get("mode") || "";
const PARTIAL = MODE === "partial";

(function modeUI() {
  const banner = $("modeBanner"), heading = $("inputHeading"), hint = $("inputHint");
  if (PARTIAL) {
    heading.textContent = "1. Partially-signed transaction (base64)";
    hint.textContent = "Paste the base64 partially-signed tx from the operator. Slot 1 = the mint's signature over the frozen message; slot 0 stays unsigned — your wallet fills it. The page derives the frozen message and expected signer from this transaction itself and checks both against the pinned URL values before anything reaches the wallet.";
    banner.innerHTML = "<strong>Partial-signing mode</strong> — a valid mint signature is already attached (slot 1). Per Phantom's priority-fee documentation, transactions that already carry signatures should NOT get auto-injected fee instructions. Your wallet should receive the transaction with the mint signature intact and fill only its own slot.";
  } else {
    heading.textContent = "1. Package JSON";
    hint.textContent = 'Paste the unsigned plan package JSON: {"version":1,"state":"UNSIGNED","plan":{...},"config_hash":"...","unsigned_message_b64":"...","unsigned_message_sha256":"..."}';
    banner.innerHTML = "<strong>Unsigned-package mode</strong> — your wallet signs the frozen message alone.";
  }
})();

function showErr(msg) {
  $("err").textContent = msg;
  $("clearErr").style.display = "inline-block";
}
$("clearErr").addEventListener("click", () => {
  $("err").textContent = "";
  $("clearErr").style.display = "none";
});

function report(obj) { $("result").textContent = JSON.stringify(obj, null, 2); }

function walletSigLooksReal(sigs) {
  return sigs && sigs[0] && !sigs[0].startsWith("AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA");
}

$("sign").addEventListener("click", async () => {
  showErr("");
  report({status: "working…"});
  try {
    const inputValue = $("pkg").value.trim();
    if (!inputValue) {
      showErr("Input is empty — paste the " + (PARTIAL ? "partially-signed tx base64" : "package JSON") + " first.");
      report({status: "ABORT"});
      return;
    }

    /* ==================== PARTIAL MODE ==================== */
    if (PARTIAL) {
      let wire;
      try { wire = b64ToBytes(inputValue); }
      catch (e) { showErr("Input is not valid base64: " + e.message); report({status:"ABORT"}); return; }

      // Wire: [numSigs=2][sig0 64][sig1 64][0x80][msg...]
      if (wire.length < 130 || wire[0] !== 2) {
        showErr("Not a 2-signature partially-signed v0 tx (first byte = " + wire[0] + ", length = " + wire.length + ").");
        report({status: "ABORT"});
        return;
      }
      const sig1 = wire.slice(65, 129);
      if (wire[129] !== 0x80) {
        showErr("Version byte must be 0x80 (v0), got 0x" + wire[129].toString(16) + ".");
        report({status: "ABORT"});
        return;
      }
      const partialMsgBytes = wire.slice(130);

      // Derive frozen message + expected signer FROM THE TX ITSELF
      const msgObj = solanaWeb3.VersionedMessage.deserialize(wire.slice(129));
      const txFeePayer = msgObj.staticAccountKeys[0].toBase58();
      const txMessageDigest = await sha256Hex(partialMsgBytes);

      if (EXPECT_DIGEST && txMessageDigest !== EXPECT_DIGEST) {
        report({
          status: "ABORT",
          reason: "partially-signed tx message digest does NOT match the pinned digest — refusing.",
          expected_digest: EXPECT_DIGEST,
          tx_message_digest: txMessageDigest,
        });
        showErr("Message digest mismatch — refusing to sign. Details in result box.");
        return;
      }
      if (EXPECT_WALLET && txFeePayer !== EXPECT_WALLET) {
        report({
          status: "ABORT",
          reason: "partially-signed tx fee payer does NOT match the pinned signer — refusing.",
          expected_signer: EXPECT_WALLET,
          tx_fee_payer: txFeePayer,
        });
        showErr("Signer mismatch — refusing to sign. Details in result box.");
        return;
      }

      const provider = getProvider();
      if (!provider) {
        report({status: "ABORT", reason: "no compatible wallet provider in this browser (need window.solana etc.)"});
        showErr("No Phantom-like wallet provider found in this browser.");
        return;
      }
      $("walletName").textContent = provider.isPhantom ? "Phantom" : "provider";
      await provider.connect();

      // Build tx object; signatures: slot0 = default zeros (wallet fills), slot1 = mint sig
      const partialTx = new solanaWeb3.VersionedTransaction(msgObj);
      partialTx.signatures[1] = sig1;

      // Verify the exact serialized bytes the wallet will receive
      const preWire = partialTx.serialize();
      const preDigest = await sha256Hex(preWire);

      const signed = await provider.signTransaction(partialTx);

      // Post-signing byte-for-byte message + slot checks
      const afterWire = signed.message.serialize();
      const afterDigest = await sha256Hex(afterWire);
      const messageUnchanged = (afterWire.length === partialMsgBytes.length + 1) && afterDigest === txMessageDigest;
      const signedSigs = signed.signatures ? signed.signatures.map(s => bytesToB64(s)) : null;
      const mintSigPreserved = signedSigs ? signedSigs[1] === bytesToB64(sig1) : null;

      report({
        status: "SIGNED via partially-signed tx (Phantom's documented 'already signed' condition)",
        wallet_detected: provider.isPhantom ? "Phantom" : (navigator.userAgent || "custom"),
        browserUA: navigator.userAgent,
        sign_path_used: "signTransaction on a partially-signed tx (slot1 = mint partial sig pre-attached)",
        tx_message_digest: txMessageDigest,
        message_unchanged_by_signing: messageUnchanged,
        mint_signature_preserved: mintSigPreserved,
        wallet_signature_b64_index0: signedSigs ? signedSigs[0] : null,
        signatures_all: signedSigs,
        wallet_response_b64: bytesToB64(signed.serialize()),
        serialized_tx_digest_before_wallet: preDigest,
        serialized_tx_digest_after_wallet: afterDigest,
        next_step_operator: (walletSigLooksReal(signedSigs) && mintSigPreserved && messageUnchanged)
          ? "paste wallet_signature_b64_index0 + signatures_all[1] into create_sign_cli.py — full validator stack will accept or reject"
          : "report the mismatch shown above back to the operator",
      });
      return;
    }

    /* ==================== DEFAULT MODE (package JSON) ==================== */
    let pkg;
    try { pkg = JSON.parse(inputValue); }
    catch (e) { showErr("Not valid JSON: " + e.message); report({status: "ABORT"}); return; }
    const plan = pkg.plan || pkg;

    const msgBytes = b64ToBytes(pkg.unsigned_message_b64);
    const pkgDigest = await sha256Hex(msgBytes);
    if (pkgDigest !== pkg.unsigned_message_sha256) {
      report({status: "ABORT", reason: "package unsigned_message digest mismatch — JSON corrupted?"});
      showErr("Package digest mismatch. Details in result box.");
      return;
    }
    const pkgFeePayer = plan.fee_payer;
    if (EXPECT_WALLET && pkgFeePayer !== EXPECT_WALLET) {
      report({
        status: "ABORT",
        reason: "package fee_payer does NOT match the pinned wallet — regenerate the package for your connected wallet.",
        expected_signer: EXPECT_WALLET,
        package_signer: pkgFeePayer,
      });
      showErr("Signer mismatch — refusing. Details in result box.");
      return;
    }
    if (EXPECT_DIGEST && pkgDigest !== EXPECT_DIGEST) {
      report({
        status: "ABORT",
        reason: "message digest does NOT match the pinned digest — refusing.",
        expected_digest: EXPECT_DIGEST,
        actual_digest: pkgDigest,
      });
      showErr("Digest drift — refusing. Details in result box.");
      return;
    }

    // Byte-exact parse: never recompile (learned in testing: JS compile is NOT byte-compatible
    // with the executor's Python compiler)
    const wireIn = new Uint8Array(1 + msgBytes.length);
    wireIn[0] = 0x80;
    wireIn.set(msgBytes, 1);
    const msgV0 = solanaWeb3.VersionedMessage.deserialize(wireIn);
    const digestWireBefore = await sha256Hex(wireIn);

    const tx = new solanaWeb3.VersionedTransaction(msgV0);

    const provider = getProvider();
    if (!provider) {
      report({status: "ABORT", reason: "no compatible wallet provider in this browser (need window.solana etc.)"});
      return;
    }
    $("walletName").textContent = provider.isPhantom ? "Phantom" : "provider";
    await provider.connect();

    // signMessage = diagnostic-only path (PAUSED by operator; not tx-signing compatibility)
    const PAYLOAD = new Uint8Array(1 + msgBytes.length);
    PAYLOAD[0] = 0x80;
    PAYLOAD.set(msgBytes, 1);

    let signedViaSignTransaction = false;
    let sigBytes = null;

    if (MODE === "signMessage" || !provider.signTransaction) {
      const res = await provider.signMessage(PAYLOAD, "utf8");
      sigBytes = res.signature;
    } else {
      const signedTx = await provider.signTransaction(tx);
      const afterWire = signedTx.message.serialize();
      const afterDigest = await sha256Hex(afterWire);
      if (afterDigest !== digestWireBefore) {
        report({
          status: "SIGNED — BUT WALLET MUTATED THE MESSAGE",
          wallet_detected: provider.isPhantom ? "Phantom" : (navigator.userAgent || "custom"),
          reason: "wallet injected/reordered instructions (typical: ComputeBudget priority-fee prelude). Signature does NOT verify against the frozen plan — rejected by design.",
          digest_wire_before: digestWireBefore,
          digest_wire_after: afterDigest,
          your_signature_verifies_against: "wallet's own mutated message — NOT the frozen plan",
          operator_next_step: "retry with &mode=partial (pre-attached mint sig → Phantom's documented no-injection condition)",
        });
        return;
      }
      sigBytes = signedTx.signatures[0];
      signedViaSignTransaction = true;
    }

    const sigB64 = bytesToB64(sigBytes);
    report({
      status: "SIGNED — NOT SUBMITTED (nothing was sent anywhere)",
      wallet_detected: provider.isPhantom ? "Phantom" : (navigator.userAgent || "custom"),
      browserUA: navigator.userAgent,
      sign_path_used: signedViaSignTransaction ? "signTransaction" : "signMessage (diagnostic only — NOT tx-signing compatibility)",
      unsigned_package_message_digest: pkgDigest,
      message_digest_before_signing_wire: digestWireBefore,
      signers_required: 2,
      signer_slots_explained: [
        "0 = customer wallet (this page's signer)",
        "1 = mint keypair (assembled operator-side; mint secret never shown to this page)"
      ],
      wallet_signature_b64_index0: sigB64,
      next_step_operator: "paste wallet_signature_b64_index0 into create_sign_cli.py — full validator stack will accept or reject",
    });

  } catch (err) {
    const msg = String(err && err.message || err);
    showErr(msg);
    report({status: "ERROR", error: msg});
  }
});
</script>
</body>
</html>
